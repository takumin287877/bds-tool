[package]
name = "bds-update"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
ureq = { version = "2", features = ["json"] }
zip = "9.5.1"

[[bin]]
name = "bds-tool"
path = "src/main.rs"
